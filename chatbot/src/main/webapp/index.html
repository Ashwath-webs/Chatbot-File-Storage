<!DOCTYPE html>
<html>
<head>
<title>Chatbot File System</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: linear-gradient(135deg, #000000, #2b0000, #8b0000);
}

/* Header */
header {
    background: linear-gradient(to right, #111, #400000);
    color: #ff4d4d;
    padding: 15px;
    text-align: center;
    font-size: 22px;
    box-shadow: 0 0 10px rgba(255,0,0,0.5);
}

/* Navigation */
#nav-bar {
    text-align: right;
    padding: 10px;
    background: #111;
}

#nav-bar button {
    margin-left: 10px;
    padding: 8px 15px;
    border: none;
    background: linear-gradient(to right, #ff0000, #990000);
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

#nav-bar button:hover {
    background: linear-gradient(to right, #ff3333, #cc0000);
}

/* Chat container */
#chat-container {
    display: flex;
    flex-direction: column;
    height: 90vh;
}

/* Chat area */
#chat {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

/* Messages */
.message {
    padding: 10px 15px;
    margin: 8px;
    border-radius: 15px;
    max-width: 60%;
    color: white;
}

.user {
    background: #660000;
    margin-left: auto;
    text-align: right;
}

.bot {
    background: #222;
    margin-right: auto;
}

/* Input area */
#input-area {
    display: flex;
    padding: 10px;
    background: #111;
    border-top: 1px solid #333;
}

input[type="text"] {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: none;
    outline: none;
    background: #222;
    color: white;
}

button {
    margin-left: 10px;
    padding: 10px 15px;
    border: none;
    background: linear-gradient(to right, #ff0000, #990000);
    color: white;
    border-radius: 20px;
    cursor: pointer;
}

button:hover {
    background: linear-gradient(to right, #ff3333, #cc0000);
}

/* File upload */
#file-area {
    padding: 10px;
    background: #111;
    border-top: 1px solid #333;
    text-align: center;
}

input[type="file"] {
    color: white;
}
</style>
</head>

<body>

<header>🤖 Chatbot File System</header>

<div id="nav-bar">
    <button onclick="goLogin()">Login</button>
    <button onclick="goRegister()">Register</button>
    <button onclick="logout()">Logout</button>
</div>

<div id="chat-container">
    
    <div id="chat"></div>

    <div id="input-area">
        <input type="text" id="msg" placeholder="Type a message...">
        <button onclick="send()">Send</button>
    </div>

    <div id="file-area">
        <input type="file" id="file">
        <button onclick="upload()">Upload File</button>
    </div>

</div>

<script>

function addMessage(text, type) {
    let chat = document.getElementById("chat");

    let msg = document.createElement("div");
    msg.classList.add("message", type);
    msg.innerHTML = text;

    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
}

function send() {
    let msg = document.getElementById("msg").value;

    if (msg.trim() === "") return;

    addMessage(msg, "user");

    // typing effect
    let typing = document.createElement("div");
    typing.classList.add("message", "bot");
    typing.innerHTML = "Typing...";
    document.getElementById("chat").appendChild(typing);

    fetch("chat", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "message=" + encodeURIComponent(msg)
    })
    .then(res => res.text())
    .then(data => {
        typing.remove();

        // 🔥 HANDLE ACTIONS
        if (data === "ACTION:UPLOAD") {
            addMessage("📁 Opening file upload...", "bot");
            document.getElementById("file").click();
        }

        else if (data === "ACTION:SHOW_FILES") {
            addMessage("📂 Fetching your files...", "bot");

            fetch("files") // you will create this servlet
            .then(res => res.text())
            .then(files => addMessage(files, "bot"));
        }

        else {
            addMessage(data, "bot");
        }
    });

    document.getElementById("msg").value = "";
}

function upload() {
    let file = document.getElementById("file").files[0];

    if (!file) {
        alert("Select a file first!");
        return;
    }

    let formData = new FormData();
    formData.append("file", file);

    addMessage("Uploading file...", "user");

    fetch("upload", {
        method: "POST",
        body: formData
    })
    .then(res => res.text())
    .then(data => addMessage(data, "bot"));
}
</script>

</body>
</html>
