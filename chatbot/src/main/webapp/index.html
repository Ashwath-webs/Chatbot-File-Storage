<!DOCTYPE html>
<html>
<head>
<title>Chatbot File System</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    color: white;
    min-height: 100vh;
    position: relative;
    background: black;
    overflow: hidden; /* Prevents double scrollbars */
}

/* Background Image with Opacity */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background-image: url('chatbot.jpg');
    background-size: cover;
    background-position: center;
    opacity: 0.5; /* Image opacity */
}

/* Transparent Header */
header {
    background: rgba(0, 0, 0, 0.3); /* Transparent background */
    backdrop-filter: blur(10px); /* Frosted glass effect */
    color: #ff4d4d;
    padding: 15px;
    text-align: center;
    font-size: 22px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

/* Transparent Navigation */
#nav-bar {
    text-align: right;
    padding: 10px;
    background: transparent;
}

#nav-bar button {
    margin-left: 10px;
    padding: 8px 15px;
    border: none;
    background: linear-gradient(to right, #ff0000, #990000);
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

/* Chat container */
#chat-container {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 60px); /* Dynamic height adjustment */
}

#chat {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

/* Messages */
.message {
    padding: 10px 15px;
    margin: 8px;
    border-radius: 15px;
    max-width: 60%;
}

.user {
    background: rgba(102, 0, 0, 0.7);
    margin-left: auto;
}

.bot {
    background: rgba(34, 34, 34, 0.7);
    margin-right: auto;
}

/* Transparent Input area */
#input-area {
    display: flex;
    padding: 15px;
    background: rgba(0, 0, 0, 0.4); /* Transparent background */
    backdrop-filter: blur(5px);
}

input[type="text"] {
    flex: 1;
    padding: 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.2); /* Faded border */
    outline: none;
    background: rgba(255, 255, 255, 0.1); /* Transparent input field */
    color: white;
}

/* Transparent File area */
#file-area {
    padding: 15px;
    background: rgba(0, 0, 0, 0.5); /* Transparent background */
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    text-align: center;
}

button {
    margin-left: 10px;
    padding: 10px 20px;
    border: none;
    background: linear-gradient(to right, #ff0000, #990000);
    color: white;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    filter: brightness(1.2);
}
</style>
</head>

<body>

<header>🤖 Chatbot File System</header>

<div id="nav-bar">
    <button onclick="goLogin()">Login</button>
    <button onclick="goRegister()">Register</button>
    <button onclick="logout()">Logout</button>
</div>

<div id="chat-container">
    
    <div id="chat"></div>

    <div id="input-area">
        <input type="text" id="msg" placeholder="Type a message...">
        <button onclick="send()">Send</button>
    </div>

    <div id="file-area">
        <input type="file" id="file">
        <button onclick="upload()">Upload File</button>
    </div>

</div>

<script>

function addMessage(text, type) {
    let chat = document.getElementById("chat");

    let msg = document.createElement("div");
    msg.classList.add("message", type);
    msg.innerHTML = text;

    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
}

function send() {
    let msg = document.getElementById("msg").value;

    if (msg.trim() === "") return;

    addMessage(msg, "user");

    // typing effect
    let typing = document.createElement("div");
    typing.classList.add("message", "bot");
    typing.innerHTML = "Typing...";
    document.getElementById("chat").appendChild(typing);

    fetch("chat", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "message=" + encodeURIComponent(msg)
    })
    .then(res => res.text())
    .then(data => {
        typing.remove();

        // 🔥 HANDLE ACTIONS
        if (data === "ACTION:UPLOAD") {
            addMessage("📁 Opening file upload...", "bot");
            document.getElementById("file").click();
        }

        else if (data === "ACTION:SHOW_FILES") {
            addMessage("📂 Fetching your files...", "bot");

            fetch("files") // you will create this servlet
            .then(res => res.text())
            .then(files => addMessage(files, "bot"));
        }

        else {
            addMessage(data, "bot");
        }
    });

    document.getElementById("msg").value = "";
}

function upload() {
    let file = document.getElementById("file").files[0];

    if (!file) {
        alert("Select a file first!");
        return;
    }

    let formData = new FormData();
    formData.append("file", file);

    addMessage("Uploading file...", "user");

    fetch("upload", {
        method: "POST",
        body: formData
    })
    .then(res => res.text())
    .then(data => addMessage(data, "bot"));
}

function goLogin() {
    window.location.href = "login.html"; 
   
}


function goRegister() {
    window.location.href = "register.html";
   
}


function logout() {
   
    fetch("logout", { method: "POST" })
    .then(() => {
        window.location.href = "login.html"; 
    })
    .catch(err => {
        console.error("Logout failed", err);
       
        window.location.href = "login.html";
    });
}
</script>

</body>
</html>
