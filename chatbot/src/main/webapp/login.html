<!DOCTYPE html>
<html>
<head>
<title>Login</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background-color: #000; /* Fallback color */
}

/* Background Image with Opacity */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    background-image: url('https://media.istockphoto.com/id/468856268/photo/storage-room.jpg?s=612x612&w=0&k=20&c=MULAe5DGhM5lrwcp4ApziOUnTB-_OVYIuJMYvBij0mM=');
    background-size: cover;
    background-position: center;
    opacity: 0.6; /* Adjust this value (0.1 to 1.0) to change image brightness */
}

form {
    background: rgba(0, 0, 0, 0.4); /* Transparent Black */
    backdrop-filter: blur(10px); /* Frosted glass effect */
    padding: 40px;
    width: 320px;
    border-radius: 15px;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.1); /* Subtle white border */
    text-align: center;
}

h2 {
    color: #ff4d4d;
    margin-bottom: 25px;
    font-size: 28px;
    letter-spacing: 1px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.1); /* Transparent input boxes */
    color: white;
    box-sizing: border-box; /* Keeps padding inside width */
    outline: none;
}

input::placeholder {
    color: #ccc;
}

input:focus {
    border-color: #ff4d4d;
    background: rgba(255, 255, 255, 0.2);
}

button {
    margin-top: 15px;
    padding: 12px;
    background: linear-gradient(to right, #ff0000, #990000);
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    width: 100%;
    font-weight: bold;
    transition: transform 0.2s, opacity 0.2s;
}

button:hover {
    background: linear-gradient(to right, #ff3333, #cc0000);
    transform: translateY(-2px);
}

a {
    display: block;
    margin-top: 20px;
    color: #ff4d4d;
    text-decoration: none;
    font-size: 14px;
}

a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<form action="LoginServlet" method="post">
    <h2>Login</h2>

    <input name="username" placeholder="Username" required>
    <input type="password" name="password" placeholder="Password" required>

    <button type="submit">Login</button>

    <a href="register.html">Create new account</a>
</form>

</body>
</html>
